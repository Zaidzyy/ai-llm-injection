[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redteam"
version = "0.1.0"
description = "Canary-based LLM instruction-hierarchy robustness harness and prompt-injection detector"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Zaid" }]
keywords = ["llm", "security", "prompt-injection", "red-team", "owasp", "ai-safety"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Topic :: Security",
  "Programming Language :: Python :: 3.10",
  "License :: OSI Approved :: MIT License",
]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
redteam = "redteam.cli:main"

[project.urls]
Homepage = "https://github.com/Zaidzyy/ai-llm-injection"
Issues = "https://github.com/Zaidzyy/ai-llm-injection/issues"

[tool.setuptools.packages.find]
include = ["redteam*"]

[tool.setuptools.package-data]
redteam = ["../probes/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
